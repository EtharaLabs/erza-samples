slug = "ionosphere-arc-vtec-calibration"
name = "Ionosphere Arc Vtec Calibration"
lever = "withheld-empirical-reference"
# lever bound 2026-08-31. calibration requires the published satellite and receiver bias product, an empirical table that cannot be recalled and is supplied only by the mounted skill

[metadata]
author_name = "Erza"
category    = "natural-science"
subcategory = "ionospheric-physics"
category_confidence = "high"
difficulty  = "hard"
difficulty_explanation = "Turning a pair of code pseudoranges into a usable electron content is arithmetic; turning it into a *calibrated* one is not. Both ranges carry the hardware delay of the transmitting satellite and of the receiving station on the exact signal each of them tracked, and those delays are nanosecond-scale quantities an analysis centre measures over a whole network and republishes every day. A nanosecond of uncorrected delay is nearly three TECU, so leaving them in moves every arc here by 30 to 260 times the tolerance - larger than the diurnal signal being measured. The delays cannot be recovered from the record supplied: each arc has its own free electron-content level, no station coordinates or azimuths are given, and the mapping factor varies too gently across an arc for its shape to pin the offset against the code scatter. The receivers, satellites and epochs carry opaque labels, so the published values cannot be looked up from any index either; they are supplied only in the reference the skill mounts. Given those values the remaining work is real but ordinary: pick the entries that match the signals each receiver actually reports, combine the satellite and station sides, reduce every epoch to the vertical, and average each arc."
task_type   = ["calculation", "analysis"]
modality    = ["csv", "time-series"]
interface   = ["terminal", "python"]
skill_type  = ["domain-procedure", "file-format-knowledge"]
tags        = ["gnss", "ionosphere", "total-electron-content", "pseudorange", "code-bias", "geodesy"]

[environment]
network_mode      = "no-network"
os                = "linux"
