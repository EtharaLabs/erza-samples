schema_version = "1.4"
artifacts = [
  { source = "/workspace/regress", exclude = ["target"] },
  "/workspace/output",
]

reward_type = "bounded_continuous"

[task]
name = "ethara/fdc50914-fdba-4675-a017-31f808f4cf2a"
version = "1.0.0"
description = "Repair a Rust ECMAScript regular-expression engine so its class sets, case-insensitive matching, duplicate named groups, backreferences, and quantifier backtracking follow ECMA-262 2025 section 22.2, and write a root-cause note."
authors = [{ name = "shraiy.khaddar", email = "shraiy.khaddar@ethara.ai" }]
keywords = ["debugging", "regex", "ecmascript", "specification-conformance", "backtracking", "rust"]

[metadata]
difficulty = "hard"
category = "software-engineering"
subcategory = "debugging"
task_type = ["debugging", "repair"]
modality = ["source-code", "structured-text"]
interface = ["terminal", "rust"]
skill_type = ["debugging-heuristic", "specification-reading"]
tags = ["regex", "ecma-262", "unicode-sets", "case-folding", "backtracking", "rust"]
null_floor = 0.0
discrimination_weight = 0.4561
platforms = ["linux/amd64", "linux/arm64"]

[verifier]
timeout_sec = 3600.0
user = "root"
network_mode = "allowlist"
allowed_hosts = ["api.anthropic.com", "api.openai.com", "host.docker.internal"]
environment_mode = "separate"

[verifier.env]
ANTHROPIC_API_BASE = "${ANTHROPIC_API_BASE:-https://api.anthropic.com}"
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY:-}"
OPENAI_API_KEY = "${OPENAI_API_KEY:-}"
OPENAI_BASE_URL = "${OPENAI_BASE_URL:-https://api.openai.com/v1}"

[verifier.environment]
network_mode = "allowlist"
allowed_hosts = ["api.anthropic.com", "api.openai.com", "host.docker.internal"]
build_timeout_sec = 3600.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0

[agent]
timeout_sec = 10800.0
user = "1000:1000"
network_mode = "allowlist"
allowed_hosts = ["api.openai.com", "api.anthropic.com"]

[environment]
network_mode = "no-network"
build_timeout_sec = 3600.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
workdir = "/workspace"
skills_dir = "/harbor/skills"
