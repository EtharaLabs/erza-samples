difficulty_explanation = "Requires computing day-count year fractions and accrued interest under six named fixed-income conventions whose exact ISDA-2006 rules a general model's default date arithmetic gets wrong, and which the prompt deliberately does NOT spell out: the model must recall (1) the 30/360 US Bond Basis last-day-of- February and 31->30 adjustment cascade, whose order matters; (2) the 30E/360 Eurobond unconditional 31->30 with NO February rule, so identical dates give a different count than 30/360 US; (3) the ACT/ACT ISDA leap-day-splitting rule, where days falling in a leap year are divided by 366 and days in a non-leap year by 365 - easily confused with both ACT/365 Fixed and ACT/ACT ICMA; and (4) the ACT/ACT ICMA period-based denominator equal to frequency times the days in the reference coupon period, NOT a calendar-year 365 or 366; while (5) keeping ACT/360 and ACT/365 Fixed apart. The instruments are adversarial: leap Feb-29 and 31st month-end stubs, accrual periods straddling year and leap-year boundaries, and short versus long ICMA coupon periods. A naive days/365, a plain 30/360 without the end-of-month rules, an ACT/ACT with a calendar-year denominator, or an ACT/ACT ISDA collapsed to ACT/365 Fixed each land many orders of magnitude outside the 1e-10 year-fraction tolerance. The obvious library (QuantLib or any finance package) is forbidden; the rules must be recalled and hand-implemented."
