schema_version = "1.4"
artifacts = ["/app/repo", "/app/output/note.md"]

reward_type = "bounded_continuous"

[task]
name = "ethara/0ddf264f-938b-4b5c-817c-45766d0dcf81"
version = "0.1.0"
description = "Repair the Pagecraft static site generator so incremental rebuilds, generated outputs and the check command agree on the shipped example site, and write a root-cause note."
authors = [{ name = "ananya.vashisth", email = "ananya.vashisth@ethara.ai" }]
keywords = ["python", "static-site-generator", "debugging", "build-chain", "root-cause-analysis"]

[metadata]
difficulty = "hard"
category = "software-engineering"
subcategory = "debugging"
task_type = ["debugging", "repair"]
modality = ["source-code", "structured-text"]
interface = ["terminal", "python"]
skill_type = ["debugging-heuristic", "root-cause-analysis"]
tags = ["static-site-generator", "incremental-build", "rss", "sitemap", "python"]
null_floor = 0.0
discrimination_weight = 0.5
platforms = ["linux/amd64", "linux/arm64"]

[verifier]
timeout_sec = 900
network_mode = "allowlist"
allowed_hosts = ["api.openai.com", "api.anthropic.com", "host.docker.internal"]
environment_mode = "separate"

[verifier.environment]
network_mode = "allowlist"
allowed_hosts = ["api.openai.com", "api.anthropic.com", "host.docker.internal"]

[verifier.env]
ANTHROPIC_API_BASE = "${ANTHROPIC_API_BASE:-https://api.anthropic.com}"
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY:-}"
OPENAI_API_KEY = "${OPENAI_API_KEY:-}"
OPENAI_BASE_URL = "${OPENAI_BASE_URL:-https://api.openai.com/v1}"
LITELLM_LOCAL_MODEL_COST_MAP = "True"

[agent]
timeout_sec = 3600
user = "1000:1000"
network_mode = "allowlist"
allowed_hosts = ["api.openai.com", "api.anthropic.com"]

[environment]
network_mode = "no-network"
build_timeout_sec = 1200
cpus = 2
memory_mb = 4096
