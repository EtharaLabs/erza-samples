[[criterion]]
id = "j19_extra_defects_evidenced"
name = "j19_extra_defects_evidenced"
description = "The note at /app/output/note.md claims no defect beyond the manifest loader, feed lastBuildDate, check link resolution and sitemap lastmod defects. A claimed defect is a statement that the shipped Pagecraft code produces a wrong output or behaviour. After those four fixes the shipped build chain and its full test suite produce correct output, so any further claimed defect fails this item, whatever file, function, output or command it names. A residual risk, limitation or untested case stated as such, without asserting wrong behaviour, is not a claimed defect. A defect the note describes in more than one section or at more than one call site counts as one of those four. One statement is true and is not a claimed defect for this item: that `pagecraft build --full` still uses the existing build manifest (it skips unchanged assets and removes stale outputs recorded there) although its help text says it ignores the manifest."
type = "binary"
weight = 3
negate = false
[criterion.annotations]
mode = "judged"
type = "INVARIANT"
obligation = "D2"
dimension = "robustness"
evidence = "written_note"
residue = "whether a sentence asserts wrong behaviour in the shipped code or only states a risk is a reading judgement over open-ended prose"

