[judge]
judge = "anthropic/claude-fable-5-1"
mode = "individual"
files = ["/app/output/note.md"]

[[criterion]]
id = "j01_d1_location"
name = "j01_d1_location"
description = "The note at /app/output/note.md locates the incremental build manifest defect at module and function level, in the manifest loading code of the builder module."
type = "binary"
weight = 3
negate = false
[criterion.annotations]
mode = "judged"
type = "VALUE"
obligation = "D2"
dimension = "coverage"
evidence = "written_note"
residue = "naming a code location in prose is free text; no deterministic check can match every valid phrasing of a module and function reference"

[[criterion]]
id = "j02_d1_symptom"
name = "j02_d1_symptom"
description = "The note at /app/output/note.md states an observable symptom of the manifest defect: an incremental rebuild skips no unchanged output, or leaves the output of removed content, such as a tag page, in place."
type = "binary"
weight = 3
negate = false
[criterion.annotations]
mode = "judged"
type = "VALUE"
obligation = "D2"
dimension = "outcome"
evidence = "written_note"
residue = "the stated symptom is prose; the compiled incremental checks grade the repaired behaviour, not the account of it"

[[criterion]]
id = "j03_d1_propagation"
name = "j03_d1_propagation"
description = "The note at /app/output/note.md states that the empty previous manifest carries into the incremental build, so the skip step skips no unchanged output and the stale-output step removes no orphaned output."
type = "binary"
weight = 3
negate = false
[criterion.annotations]
mode = "judged"
type = "EFFECT"
obligation = "D2"
dimension = "outcome"
evidence = "written_note"
residue = "propagation to two downstream steps is a causal claim in prose; the compiled checks grade the repaired behaviour, not the account of it"

[[criterion]]
id = "j04_d1_fix_and_why"
name = "j04_d1_fix_and_why"
description = "The note at /app/output/note.md states a fix in the manifest load or save code that makes the loader accept the manifest the saver writes, and states why that repairs the stage producing the empty previous manifest rather than the downstream skip or stale-output steps; any correct fix at that stage passes."
type = "binary"
weight = 3
negate = false
[criterion.annotations]
mode = "judged"
type = "INVARIANT"
obligation = "D2"
dimension = "craft"
evidence = "written_note"
residue = "a fix justification is an argument in prose, and several correct fixes exist at the generating stage; the compiled checks grade the repaired behaviour, not the reasoning"

[[criterion]]
id = "j05_d1_evidence"
name = "j05_d1_evidence"
description = "The note at /app/output/note.md gives the concrete evidence used to localize the manifest defect, such as the key the saver writes differing from the key the loader reads, a skipped count of zero, or a stale output left after a rebuild."
type = "binary"
weight = 1
negate = false
[criterion.annotations]
mode = "judged"
type = "VALUE"
obligation = "D2"
dimension = "process"
evidence = "written_note"
residue = "process is graded only through the account the note gives, which only a judge can read"

[[criterion]]
id = "j06_d1_verification"
name = "j06_d1_verification"
description = "The note at /app/output/note.md names a command run or a test whose result changed that verified the manifest fix."
type = "binary"
weight = 1
