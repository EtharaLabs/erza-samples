slug = "antenna-phase-centre-correction"
name = "Antenna Phase Centre Correction"
lever = "withheld-empirical-reference"
# lever bound 2026-08-31. the correction requires the antenna's own phase-centre offset and variation pattern, an empirical per-model calibration supplied only by the mounted skill

[metadata]
author_name = "Erza"
category    = "natural-science"
subcategory = "geodesy"
category_confidence = "high"
difficulty  = "hard"
difficulty_explanation = "A geodetic receiver antenna does not observe from a single point. Its electrical phase centre moves with the direction the signal arrives from and with the carrier frequency, by up to a few centimetres, and the pattern is a property of that one antenna model - measured on a robot or in an anechoic chamber and published as a table of offsets and gridded variations. It is not a formula and it does not transfer between models: two geodetic antennas at the same site can differ by nearly a decimetre in the vertical offset alone. The antennas here carry opaque labels and no manufacturer type or radome code, so their calibration tables cannot be looked up from any public index; they are supplied only in the mounted reference. The routes available without the table - projecting the single nominal offset shown for orientation, applying the offset but no variation, or applying nothing at all - are wrong at every case by 22x to 550x the tolerance, because the offset is model-specific and the variation runs to several millimetres. Given the table the remaining work is real but ordinary: parse the block, pick the right frequency, project the offset onto the line of sight, and interpolate the variation grid."
task_type   = ["calculation", "analysis"]
modality    = ["csv", "scientific-data"]
interface   = ["terminal", "python"]
skill_type  = ["domain-procedure", "file-format-knowledge"]
tags        = ["geodesy", "gnss", "antenna-calibration", "phase-centre", "antex", "positioning"]

