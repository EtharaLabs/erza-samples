  - F2
  - F3
  checkers:
  - C01
  - C06
  - C07
  - C08
- title: Repair duplicate-name backreferences
  action: a backreference to a name shared by several groups is lowered to a concatenation of the backreferences, so the unset groups match empty and the set one matches
  faults:
  - F4
  checkers:
  - C05
- title: Repair the backtracker state
  action: entering a loop restores, on backtrack, the iteration state it overwrites, and ending a capture group records the group's old value on the backtrack stack, forward and inside lookbehind
  faults:
  - F5
  - F6
  checkers:
  - C02
  - C03
  - C04
- title: Repair without breaking the kept properties
  action: "the repaired library still passes the shipped tests and keeps the UTF-16 and UCS-2 entry points and the budget API working; these items score only for a changed library, so they are part of the repair and never green on the unmodified base"
