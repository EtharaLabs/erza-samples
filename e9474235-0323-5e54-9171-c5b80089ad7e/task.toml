difficulty_explanation = "Predicting a tide height to a tenth of a metre at a specific instant requires the gauge's harmonic constants - the amplitude and Greenwich phase lag of each tidal constituent. These are empirical, gauge-specific quantities determined from that gauge's own water-level records; they cannot be recalled or estimated to this precision and they differ completely from one gauge to the next (the same constituent can be centimetres at one site and metres at another). The gauges are identified only by opaque labels, so the constants cannot be looked up from any public source - they are supplied only in the reference the skill mounts. Given the constants, the height is a harmonic synthesis over roughly thirty constituents, each carried through its equilibrium argument and 18.6-year nodal correction, plus the datum offset. The naive routes - reporting the single recent water level supplied for orientation, or the long-term mean level - are wrong at every target instant by several times the tolerance (7-8x on average), because the tide swings across its full range between the listed times. Even with the constants there is a load-bearing subtlety: dropping the minor constituents and keeping only the few largest displaces some instants past tolerance, so completeness of the constituent set is required (0.320 m worst gap against a 0.100 m tolerance). The nodal corrections are part of the reference computation and are applied throughout, but omitting them on their own stays inside tolerance on this instance (0.093 m worst gap), which the control ledger in tests/expected_values.json records as a non-lever."
