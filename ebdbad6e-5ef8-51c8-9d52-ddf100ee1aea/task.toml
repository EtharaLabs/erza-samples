difficulty_explanation = """Adding up a fuel ledger is arithmetic. Putting it on an energy basis is not, because the energy carried by one barrel or one short ton is not a single number. It is a measured annual average that the national statistics agency publishes separately for each class of customer that burned the fuel and for each year, and the classes differ because the product mix behind the word "petroleum" and the rank behind the word "coal" differ. Across the five books in this ledger the published values span 4.52 to 4.98 million Btu per barrel and 18.3 to 28.7 million Btu per short ton, so pricing the whole ledger with one constant per fuel moves every graded figure by 3 to 30 times the tolerance, and taking the agency's own all-customer average instead of the class row still misses every one of them by at least 2.8 tolerances. The values are a measured, published set that cannot be derived from the ledger supplied: the ledger carries physical units only, so there is no quantity in it that stands in a fixed relation to the energy figures, and the accounts are a synthetic book with opaque labels, so no graded figure is a published national statistic that could be recalled instead of computed."""
