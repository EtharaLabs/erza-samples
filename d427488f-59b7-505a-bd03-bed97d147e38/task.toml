lever = "chained-precision-survival"
# lever bound 2026-08-31. the deliverable rides a chain of numeric derivations under a bespoke house method; one step at the wrong precision, order or convention yields a plausible value that fails tolerance

[metadata]
author_name = "Erza"
category    = "natural-science"
subcategory = "metrology"
category_confidence = "high"
difficulty  = "hard"
difficulty_explanation = "Requires computing an interlaboratory proficiency-testing consensus by a bespoke house method (ERZA-RB1) rather than a textbook summary, and chaining several brittle steps without error: (1) reducing each lab by the MEDIAN of its replicates, not the mean, so a single spiked replicate cannot move the lab value; (2) running an Algorithm-A style clamped robust location/scale iteration to convergence with the fixed house clamp constant; (3) applying the closed-form beta(c) Fisher-consistency bias correction to the clamped scale, computed from the normal CDF/PDF via the error function; (4) forming the combined uncertainty with the house coverage factor; and (5) reporting the robust SCALE plus a robust zeta-prime for a nominated lab. Reporting the naive plain-mean scale / standard-z decoy supplied in the inputs, reducing by the mean, omitting the beta debias, or using a different clamp each miss at least one required output."
task_type   = ["analysis", "calculation"]
modality    = ["tabular", "scientific-data"]
interface   = ["terminal", "python"]
skill_type  = ["domain-procedure", "mathematical-method"]
tags        = ["metrology", "proficiency-testing", "interlaboratory", "robust-statistics", "algorithm-a", "consensus", "zeta-score", "uncertainty"]

