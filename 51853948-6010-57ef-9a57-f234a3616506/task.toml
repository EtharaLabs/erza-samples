name = "Gauge Rating Block Discharge V3"
lever = "withheld-empirical-reference"
# lever bound 2026-08-31. the answer requires the gauge's own stage-discharge rating, an empirical instrument-specific table that cannot be recalled or looked up and is supplied only by the mounted skill

[metadata]
author_name = "Erza"
category    = "natural-science"
subcategory = "hydrology"
category_confidence = "high"
difficulty  = "hard"
difficulty_explanation = "Turning a water level into a discharge needs the gauge's own stage-discharge rating - the empirical table a hydrographer builds from direct current-meter measurements at that one site and revises whenever the channel control moves. It is not a formula. Two gauges reading the same gage height can be a thousand cubic feet per second apart, because the rating encodes that site's channel geometry, slope and roughness. The gauges here carry opaque labels and no coordinates, so the tables cannot be looked up from any public index; they are supplied only in the reference the skill mounts. The naive routes - scaling the one supplied recent measurement by a power law, scaling it linearly, or simply reporting it - are wrong at every block by 4x to 380x the tolerance, because a rating is strongly non-linear and the recent measurement was taken ten days earlier at a different stage. Given the table the remaining work is real but ordinary: rate each reported instant, then integrate over each block, weighting by the time each sample represents rather than averaging the samples."
task_type   = ["calculation", "analysis"]
modality    = ["csv", "time-series"]
interface   = ["terminal", "python"]
skill_type  = ["domain-procedure", "mathematical-method"]
tags        = ["hydrology", "streamflow", "discharge", "rating-curve", "gauging", "time-series"]

[environment]
network_mode      = "no-network"
os                = "linux"
